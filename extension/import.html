<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atlas Tab Groups Importer</title>
    <style>
      :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { max-width: 44rem; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.5; }
      main { border: 1px solid color-mix(in srgb, currentColor 22%, transparent); border-radius: 12px; padding: 1.5rem; }
      h1 { font-size: 1.35rem; margin-top: 0; }
      #status { font-weight: 600; }
      #details { white-space: pre-wrap; color: color-mix(in srgb, currentColor 72%, transparent); }
      .ok { color: #16803c; }
      .error { color: #b42318; }
    </style>
  </head>
  <body>
    <main>
      <h1>Atlas Tab Groups Importer</h1>
      <p id="status">Preparing the local migration…</p>
      <p id="details"></p>
    </main>
    <script src="import.js"></script>
  </body>
</html>
