<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Select the extension folder in Chrome’s Load unpacked dialog</title>
  <desc id="desc">A privacy-safe Finder-style illustration highlighting the extension folder that contains manifest.json.</desc>
  <rect width="1280" height="720" fill="#f4f6f8"/>
  <rect x="190" y="100" width="900" height="520" rx="16" fill="#ffffff" stroke="#b8c2cc" stroke-width="2"/>
  <rect x="190" y="100" width="900" height="72" rx="16" fill="#e9edf2"/>
  <text x="228" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#1e293b">Choose the folder to load</text>
  <rect x="230" y="205" width="820" height="70" rx="10" fill="#f8fafc"/>
  <text x="262" y="249" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" fill="#475569">atlas-to-chrome-tab-group-migration-kit</text>
  <path d="M295 327 h34 l13 14 h120 v46 h-167z" fill="#93c5fd"/>
  <text x="486" y="362" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" fill="#334155">atlas_to_chrome.py</text>
  <rect x="245" y="385" width="790" height="143" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <path d="M295 428 h34 l13 14 h120 v46 h-167z" fill="#60a5fa"/>
  <text x="486" y="463" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#1d4ed8">extension</text>
  <text x="486" y="502" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" fill="#1e40af">contains manifest.json, import.html, and import.js</text>
  <path d="M743 565 C751 610 863 598 866 536" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <path d="M849 548 l17 -12 l1 21" fill="#2563eb"/>
  <text x="588" y="644" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#1d4ed8">Select this folder, not the package root.</text>
</svg>
